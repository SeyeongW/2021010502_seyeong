%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
% SU2 config – Stage 1 (Stabilization Only)
% Purpose: Robust convergence & restart generation
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

SOLVER= RANS
KIND_TURB_MODEL= SST
MATH_PROBLEM= DIRECT
RESTART_SOL= NO

% ---------------- Free-stream ----------------
MACH_NUMBER= 0.3
AOA= 0.0
SIDESLIP_ANGLE= 0.0

INIT_OPTION= REYNOLDS
FREESTREAM_OPTION= TEMPERATURE_FS
FREESTREAM_TEMPERATURE= 288.15

REYNOLDS_NUMBER= 2600000.0
REYNOLDS_LENGTH= 1.0

% ---------------- Gas model ------------------
FLUID_MODEL= STANDARD_AIR

% ---------------- Viscosity ------------------
VISCOSITY_MODEL= SUTHERLAND

% ---------------- Reference values -----------
REF_ORIGIN_MOMENT_X= 0.25
REF_ORIGIN_MOMENT_Y= 0.0
REF_ORIGIN_MOMENT_Z= 0.0
REF_LENGTH= 1.0
REF_AREA= 1.0
REF_DIMENSIONALIZATION= FREESTREAM_VEL_EQ_ONE

% ---------------- Boundary conditions --------
MARKER_HEATFLUX= ( airfoil, 0.0 )
MARKER_FAR= ( farfield )
MARKER_PLOTTING= ( airfoil )
MARKER_MONITORING= ( airfoil )

% ---------------- Numerics (STABLE) ----------
NUM_METHOD_GRAD= GREEN_GAUSS

CFL_NUMBER= 0.3
CFL_ADAPT= NO

TIME_DISCRE_FLOW= EULER_IMPLICIT
TIME_DISCRE_TURB= EULER_IMPLICIT

% 1st order only (VERY IMPORTANT)
MUSCL_FLOW= NO
MUSCL_TURB= NO

CONV_NUM_METHOD_FLOW= ROE
CONV_NUM_METHOD_TURB= SCALAR_UPWIND

% ---------------- Linear solver --------------
LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_PREC= JACOBI
LINEAR_SOLVER_ERROR= 1E-5
LINEAR_SOLVER_ITER= 5

% ---------------- Multigrid ------------------
MGLEVEL= 2
MGCYCLE= V_CYCLE
MG_PRE_SMOOTH= (1,1)
MG_POST_SMOOTH= (0,0)
MG_DAMP_RESTRICTION= 0.7
MG_DAMP_PROLONGATION= 0.7

% ---------------- Convergence ----------------
ITER= 50000
CONV_FIELD= DRAG
CONV_STARTITER= 50
CONV_CAUCHY_ELEMS= 100
CONV_CAUCHY_EPS= 1E-6

% ---------------- I/O ------------------------
MESH_FILENAME= VR-12.su2
MESH_FORMAT= SU2

TABULAR_FORMAT= CSV
CONV_FILENAME= history
history_OUTPUT= (ITER, RMS_RES, AERO_COEFF)
RESTART_FILENAME= restart_flow
VOLUME_FILENAME= flow
SURFACE_FILENAME= surface_flow

SCREEN_OUTPUT= (INNER_ITER, RMS_DENSITY, RMS_NU_TILDE, LIFT, DRAG)
