%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
% SU2 config – Stage 2 (Standard JST Mode)
% Robust but Accurate enough for Stall prediction
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

SOLVER= RANS
KIND_TURB_MODEL= SST
MATH_PROBLEM= DIRECT

% ---------------- Restart Setting ----------------
RESTART_SOL= YES
SOLUTION_FILENAME= restart_flow.dat
RESTART_FILENAME= restart_flow_2nd

% ---------------- Free-stream ----------------
MACH_NUMBER= 0.3
AOA= 0.0
SIDESLIP_ANGLE= 0.0
INIT_OPTION= REYNOLDS
FREESTREAM_OPTION= TEMPERATURE_FS
FREESTREAM_TEMPERATURE= 288.15
REYNOLDS_NUMBER= 2600000.0
REYNOLDS_LENGTH= 1.0

% ---------------- Gas & Viscosity ------------
FLUID_MODEL= STANDARD_AIR
VISCOSITY_MODEL= SUTHERLAND
MU_REF= 1.716E-5
MU_T_REF= 273.15
SUTHERLAND_CONSTANT= 110.4
CONDUCTIVITY_MODEL= CONSTANT_PRANDTL
PRANDTL_LAM= 0.72
PRANDTL_TURB= 0.90

% ---------------- Reference values -----------
REF_ORIGIN_MOMENT_X= 0.25
REF_ORIGIN_MOMENT_Y= 0.00
REF_ORIGIN_MOMENT_Z= 0.00
REF_LENGTH= 1.0
REF_AREA= 1.0
REF_DIMENSIONALIZATION= FREESTREAM_VEL_EQ_ONE

% ---------------- Boundary conditions --------
MARKER_HEATFLUX= ( airfoil, 0.0 )
MARKER_FAR= ( farfield )
MARKER_PLOTTING= ( airfoil )
MARKER_MONITORING= ( airfoil )

% ---------------- Numerics (Standard JST) ----
NUM_METHOD_GRAD= GREEN_GAUSS
CFL_NUMBER= 1.0
CFL_ADAPT= NO

TIME_DISCRE_FLOW= EULER_IMPLICIT
TIME_DISCRE_TURB= EULER_IMPLICIT

CONV_NUM_METHOD_FLOW= JST
JST_SENSOR_COEFF= ( 0.5, 0.02 ) 
MUSCL_FLOW= NO

CONV_NUM_METHOD_TURB= SCALAR_UPWIND
MUSCL_TURB= NO

% ---------------- Linear solver --------------
LINEAR_SOLVER= BCGSTAB
LINEAR_SOLVER_PREC= ILU
LINEAR_SOLVER_ERROR= 1E-5
LINEAR_SOLVER_ITER= 5

% ---------------- Multigrid ------------------
MGLEVEL= 2

% ---------------- Convergence ----------------
ITER= 5000
CONV_FIELD= RMS_DENSITY
CONV_STARTITER= 10
CONV_CAUCHY_ELEMS= 100
CONV_CAUCHY_EPS= 1E-5

% ---------------- I/O ------------------------
MESH_FILENAME= VR-12.su2
MESH_FORMAT= SU2
TABULAR_FORMAT= CSV
CONV_FILENAME= history
history_OUTPUT= (ITER, RMS_RES, AERO_COEFF)
VOLUME_FILENAME= flow
SURFACE_FILENAME= surface_flow
SCREEN_OUTPUT= (INNER_ITER, WALL_TIME, RMS_DENSITY, RMS_NU_TILDE, LIFT, DRAG)